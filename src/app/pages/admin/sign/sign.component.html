<div class="admin-root">
	<div class="auth-page">
		<div class="auth-card">
			<div class="brand">PANACEA</div>
			<h1>Вхід до панелі керування</h1>
			<form (submit)="submit($event)">
				<div class="form-row">
					<label for="email">Ел. пошта</label>
					<input id="email" name="email" type="email" required autocomplete="username" />
				</div>
				<div class="form-row">
					<label for="password">Пароль</label>
					<input id="password" name="password" type="password" required autocomplete="current-password" />
				</div>
				@if (error()) {
					<p style="color: #a32b2b; font-size: 13px; margin: 0 0 14px">{{ error() }}</p>
				}
				<button class="save" type="submit" [disabled]="loading()">{{ loading() ? 'Вхід…' : 'Увійти' }}</button>
			</form>
			<a class="back" routerLink="/">← До магазину</a>
		</div>
	</div>
</div>
