<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Товари — PANACEA CRM</title><link rel="icon" href="/assets/favicon-gold.png"><link rel="stylesheet" href="/admin/admin.css"></head>
<body>
<div class="admin-layout">
 <nav class="admin-nav"><div class="brand">PANACEA</div>
  <a href="/admin/">Дашборд</a>
  <a class="active" href="/admin/products/">Товари</a>
  <a href="/admin/orders/">Замовлення</a>
  <a href="/admin/customers/">Клієнти</a>
  <a class="back" href="/">← До магазину</a>
 </nav>
 <main class="admin-main">
  <div class="admin-header"><div><h1>Товари</h1><p>Каталог PANACEA, який показується в магазині</p></div></div>
  <div class="panel">
   <div class="table-scroll"><table class="data-table"><thead><tr><th>Товар</th><th>Газованість</th><th>Паковання</th><th>Ціна</th><th>Залишок</th><th>Статус</th><th></th></tr></thead><tbody id="products-body"></tbody></table></div>
  </div>
 </main>
</div>
<dialog id="edit-dialog" class="admin-dialog"><form id="edit-form" method="dialog">
 <h2>Редагувати товар</h2>
 <input type="hidden" id="edit-id">
 <div class="form-row"><label>Товар</label><input id="edit-name" disabled></div>
 <div class="form-row"><label for="edit-gas">Газованість</label><select id="edit-gas"><option>Негазована</option><option>Слабогазована</option><option>Сильногазована</option></select></div>
 <div class="form-row"><label for="edit-material">Паковання</label><select id="edit-material"><option>Скло</option><option>Банка</option></select></div>
 <div class="form-row"><label for="edit-price">Ціна, ₴</label><input id="edit-price" type="number" min="0" step="1" required></div>
 <div class="form-row"><label for="edit-stock">Залишок, шт.</label><input id="edit-stock" type="number" min="0" step="1" required></div>
 <div class="dialog-actions"><button type="button" class="cancel" id="cancel-edit">Скасувати</button><button type="submit" class="save">Зберегти</button></div>
</form></dialog>
<script src="/products.js"></script>
<script src="/admin/admin-data.js"></script>
<script src="/admin/products-page.js" defer></script>
</body></html>
