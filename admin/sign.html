<!doctype html>
<html lang="uk"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Вхід — PANACEA CRM</title><link rel="icon" href="../assets/favicon-gold.png"><link rel="stylesheet" href="admin.css"></head>
<body>
<div class="auth-page">
 <div class="auth-card">
  <div class="brand">PANACEA</div>
  <h1>Вхід до панелі керування</h1>
  <form id="sign-form">
   <div class="form-row"><label for="email">Ел. пошта</label><input id="email" type="email" required autocomplete="username"></div>
   <div class="form-row"><label for="password">Пароль</label><input id="password" type="password" required autocomplete="current-password"></div>
   <button class="save" type="submit">Увійти</button>
  </form>
  <a class="back" href="/">← До магазину</a>
 </div>
</div>
<script src="sign.js" defer></script>
</body></html>
